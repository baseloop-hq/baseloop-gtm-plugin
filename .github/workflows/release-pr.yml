name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect release PR merge
        id: detect
        run: |
          MSG=$(git log -1 --format=%s)
          if [[ "$MSG" == chore:\ release* ]]; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release metadata
        if: steps.detect.outputs.is_release_merge == 'false'
        run: bun run release:validate

  release-pr:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      gtm_release_created: ${{ steps.release.outputs['plugins/baseloop-gtm--release_created'] }}
      gtm_tag_name: ${{ steps.release.outputs['plugins/baseloop-gtm--tag_name'] }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Maintain release PR
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build-gtm-assets:
    runs-on: ubuntu-latest
    needs: release-pr
    if: needs.release-pr.outputs.gtm_release_created == 'true'
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.release-pr.outputs.gtm_tag_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package and checksum GTM assets
        run: |
          VERSION="${TAG_NAME#baseloop-gtm-v}"
          ZIP="dist/baseloop-gtm-${VERSION}.zip"

          if [[ "$VERSION" == "$TAG_NAME" || -z "$VERSION" ]]; then
            echo "Expected baseloop-gtm-v* tag, got: $TAG_NAME" >&2
            exit 1
          fi

          bun run package:zip

          if [[ ! -f "$ZIP" ]]; then
            echo "Expected release asset missing: $ZIP" >&2
            exit 1
          fi

          (cd dist && sha256sum "baseloop-gtm-${VERSION}.zip" > checksums.txt)
          rm -rf release-assets
          mkdir release-assets
          cp "$ZIP" release-assets/
          cp dist/checksums.txt release-assets/

      - name: Upload GTM asset artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseloop-gtm-release-assets
          path: release-assets/
          if-no-files-found: error

  upload-gtm-assets:
    runs-on: ubuntu-latest
    needs: [release-pr, build-gtm-assets]
    if: needs.release-pr.outputs.gtm_release_created == 'true'
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-pr.outputs.gtm_tag_name }}

    steps:
      - name: Download GTM asset artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: baseloop-gtm-release-assets
          path: release-assets

      - name: Upload GTM release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG_NAME#baseloop-gtm-v}"

          gh release upload "$TAG_NAME" \
            "release-assets/baseloop-gtm-${VERSION}.zip" \
            "release-assets/checksums.txt" \
            --clobber
